project:
  name: gene_agent
  scenario: ont_clr_long_reads

runtime:
  checkpointer: memory
  runner: local
  forge_mode: template
  notebook_trace: true

planner:
  genome_survey:
    run_with_any_asset:
      - raw_short_dna_reads
      - clean_short_dna_reads
      - raw_long_reads
      - clean_long_reads
    error_without_size_or_reads: GENOME_SIZE_UNAVAILABLE
  assembly:
    primary_input: clean_long_reads
    default_candidates:
      - flye
      - nextdenovo
      - canu
  review:
    assembly_review_requires_human_gate: true
