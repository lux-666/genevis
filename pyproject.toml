[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gene-agent"
version = "0.1.0"
description = "LangGraph-driven multiplatform long-read genome assembly and annotation agent for ONT, HiFi, CLR, and CycloneSEQ"
requires-python = ">=3.11"
dependencies = [
    # LangGraph + checkpointer pins. We invoke `graph.get_state`,
    # `graph.update_state(cfg, update)`, `graph.invoke(None, cfg)`, and
    # `SqliteSaver(conn).setup()` — all of these are stable within a
    # major version and have changed across majors before. Re-pin
    # before bumping any of them.
    "langgraph>=1.1,<2",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "nbformat>=5.9",
]

[project.scripts]
gene-agent = "app.entrypoints.run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
tui = [
    "questionary>=2.0",
]
proxy = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"descriptors" = "app/_descriptors"
