[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gene-agent"
version = "0.1.0"
description = "LangGraph-driven ONT/CLR genome assembly and annotation workflow agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
gene-agent = "app.entrypoints.run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
proxy = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
