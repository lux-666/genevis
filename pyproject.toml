[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gene-agent"
dynamic = ["version"]
description = "LangGraph-driven multiplatform long-read genome assembly agent for ONT, HiFi, CLR, and CycloneSEQ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # LangGraph + checkpointer pins. We invoke `graph.get_state`,
    # `graph.update_state(cfg, update)`, `graph.invoke(None, cfg)`, and
    # `SqliteSaver(conn).setup()` — all of these are stable within a
    # major version and have changed across majors before. Re-pin
    # before bumping any of them.
    "langgraph>=1.1,<2",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typing-extensions>=4.12",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "nbformat>=5.9",
    "pyspoa>=0.3.2,<0.4",
]

[project.scripts]
gene-agent = "app.entrypoints.run:main"

[project.urls]
Homepage = "https://github.com/lux-666/genevis"
Documentation = "https://github.com/lux-666/genevis/blob/main/README.md"
Issues = "https://github.com/lux-666/genevis/issues"

[project.optional-dependencies]
dev = [
    # Type-check the supported Python 3.11 target with compatible NumPy stubs,
    # including when the development interpreter is newer.
    "numpy>=1.26,<2.3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
tui = [
    "questionary>=2.0",
]
proxy = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
path = "app/version.py"

[tool.hatch.build.targets.wheel.force-include]
"descriptors" = "app/_descriptors"

[tool.pytest.ini_options]
addopts = "-m 'not real_tool'"
markers = [
    "real_tool: explicitly selected checks that invoke installed biological tools",
]
