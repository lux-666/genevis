# Contig-level manifest template.
#
# Copy this file to a server-local directory, edit the placeholders,
# then pair with contig_run_config.template.json.
#
# Schema reference: app/schemas/manifest.py (InputManifest / InputAssetSpec).

session_id: contig-run-YYYYMMDD-a
sample_id: sample_name
genome_size_estimate: 500000000

# Required for Assembly Review. Use the full NCBI Latin scientific name, not a
# common name or abbreviation. The frozen NCBI snapshot resolves it and the
# runtime selects one matching, host-installed BUSCO lineage; users do not
# choose the lineage manually.
user_metadata:
  target_species: Solea ovata  # REPLACE with the real NCBI scientific name

assets:
  # Long-read-only input is valid. If short DNA reads are also declared,
  # Genome Survey prefers them for its k-mer survey.
  - asset_type: raw_long_reads
    paths:
      - /ABS/PATH/TO/long_reads.fastq.gz
    platform: cycloneseq
    layout: single
    format: fastq
    compression: gzip
    metadata:
      source: <basecaller-or-archive-name>
      note: replace with real server-local paths; do not commit private paths
