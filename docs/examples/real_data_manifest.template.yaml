# Server-side real-data manifest template.
#
# Copy this file to a server-local data directory (e.g.
# `data/server_run/manifest.yaml`) and edit the placeholders. Do not
# commit the edited copy if it carries private paths or real data locations.
#
# Schema reference: app/schemas/manifest.py (InputManifest / InputAssetSpec).
session_id: server-run-YYYYMMDD-a
sample_id: server_sample
target_assembly_level: contig
genome_size_estimate: 2000000  # replace with the operator-provided estimate
assets:
  - asset_type: raw_long_reads
    # Replace with one or more absolute server-local paths. Inventory
    # absolutises these against the manifest directory if they are relative.
    paths:
      - /ABS/PATH/TO/long_reads.fastq.gz
    platform: cycloneseq        # one of: cycloneseq, ont, clr, pacbio_hifi
    layout: single
    format: fastq               # or: fasta
    compression: gzip           # or: none
    metadata:
      source: <basecaller-or-archive-name>
      note: replace with server-local data; do not commit private paths
