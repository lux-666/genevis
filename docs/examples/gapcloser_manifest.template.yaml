# Pair with gapcloser_run_config.template.json. Replace all absolute paths.
session_id: hifi-gapcloser-YYYYMMDD-a
sample_id: hifi_gapcloser_sample
assets:
  - asset_type: assembly_fasta_registered
    paths:
      - /ABS/PATH/TO/adopted_assembly.fasta
    format: fasta
    compression: none
    metadata:
      source: replace-with-assembler-or-accession
  - asset_type: raw_long_reads
    paths:
      - /ABS/PATH/TO/sample.hifi.fastq.gz
      # List every member of this sample's HiFi read set here.
    format: fastq
    compression: gzip
    platform: pacbio_hifi
