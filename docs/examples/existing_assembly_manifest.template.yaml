# 仅 Review 运行的已有组装 manifest 模板。
#
# 将本文件和 assembly_review_run_config.template.json 复制到服务器本地
# 目录并替换占位符。配套运行配置有意只请求 assembly_review；
# 其他字面 occurrence 序列也合法，前提是每个到达阶段
# 均满足自身输入契约。
session_id: existing-assembly-review-YYYYMMDD-a
sample_id: existing_assembly_sample
user_metadata:
  target_species: Solea ovata  # 替换为真实 NCBI 学名
assets:
  # 可选 QUAST -r 参考基因组。该文件冻结为
  # 每运行资产；databases.ncbi.reference_dir 是不同证据来源。
  # - asset_type: reference_genome_fasta
  #   paths:
  #     - /ABS/PATH/TO/reference_genome.fasta
  #   format: fasta
  #   compression: none

  - asset_type: assembly_fasta_registered
    paths:
      - /ABS/PATH/TO/existing_assembly.fasta
    format: fasta
    compression: none
    metadata:
      source: <assembler-or-accession>
      note: 替换为待评审的唯一组装 FASTA
