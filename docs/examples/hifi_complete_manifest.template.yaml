# 完整路线：冻结真实运行前编辑科学事实与路径。
# 配套 hifi_complete_run_config.template.json；不要编造酶或基序。
session_id: hifi-complete-YYYYMMDD-a
sample_id: REPLACE_SAMPLE
genome_size_estimate: 500000000 # 替换为有依据的碱基数估计
user_metadata:
  target_species: Solea ovata # 替换为真实 NCBI 学名
assets:
  - asset_type: raw_long_reads
    paths:
      - /ABS/PATH/TO/hifi.fastq.gz # 列出该 HiFi 读段集合的全部成员
    platform: pacbio_hifi
    layout: single
    format: fastq
    compression: gzip
  - asset_type: hic_reads_registered
    paired_reads:
      - r1: /ABS/PATH/TO/hic_R1.fastq.gz
        r2: /ABS/PATH/TO/hic_R2.fastq.gz
    platform: illumina
    layout: paired
    format: fastq
    compression: gzip
  # 可选 QUAST 参考；缺失时参考相关指标不可用。
  # - asset_type: reference_genome_fasta
  #   paths: [/ABS/PATH/TO/reference.fasta]
  #   format: fasta
  #   compression: none
