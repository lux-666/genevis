name: code-regression

on:
  push:
  pull_request:

jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install constrained developer environment
        run: python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: Run repository code gate
        run: bash scripts/server_test.sh
