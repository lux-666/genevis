package_name: seqkit
version_constraint: ">=2.0"
language: cli
install_channel: conda
entry_patterns:
  - "seqkit stats -a -T {input_fastq} > {output_tsv}"
  - "seqkit seq -m {min_len} {input_fastq} > {output_fastq}"
help_summary: "SeqKit command-line toolkit for FASTA/FASTQ statistics."
known_pitfalls:
  - "SeqKit must be installed and available on PATH for local execution."
  - "Length filtering thresholds must be approved before use; no defaults are assumed."
resource_defaults:
  cpu_cores: 1
  memory_gb: 1.0
  gpu_required: false
  walltime_hours: 1.0
