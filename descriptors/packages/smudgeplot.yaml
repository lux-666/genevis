package_name: smudgeplot
version_constraint: ">=0.2"
language: cli
install_channel: conda
entry_patterns:
  - "smudgeplot.py hetkmers -o {prefix} < {kmer_pairs}"
  - "smudgeplot.py plot {prefix}_coverages.tsv"
help_summary: "Smudgeplot ploidy/heterozygosity support from k-mer survey data."
known_pitfalls:
  - "Interpretation requires human review when spectra are abnormal or mixed."
resource_defaults:
  cpu_cores: 4
  memory_gb: 8.0
  gpu_required: false
  walltime_hours: 2.0
