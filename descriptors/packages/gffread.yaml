package_name: gffread
version_constraint: ">=0.12"
language: cli
install_channel: conda
entry_patterns:
  - "gffread {annotation_gff} -g {genome_fasta} -x {cds_fasta} -y {proteins_fasta}"
help_summary: "Materialize CDS and protein FASTA from a candidate GFF plus genome FASTA."
known_pitfalls:
  - "Malformed GFF or missing transcript/CDS structure yields empty or no protein output."
  - "Protein translation reflects the candidate GFF as-is; it does not validate gene models."
resource_defaults:
  cpu_cores: 1
  memory_gb: 8.0
  gpu_required: false
  walltime_hours: 2.0
