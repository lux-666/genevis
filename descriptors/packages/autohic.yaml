package_name: autohic
version_constraint: ">=1.3.3"
language: python
install_channel: container
entry_patterns:
  - "python3.9 autohic.py -c {cfg_autohic_txt}"
help_summary: "AutoHiC end-to-end chromosome assembly with integrated Juicer, 3D-DNA, deep-learning correction, chromosome assignment, and HTML reporting."
known_pitfalls:
  - "The input named REFERENCE_GENOME is a contig-level assembly and is copied before AutoHiC can normalize it in place."
  - "Paired Hi-C reads are normalized to AutoHiC's required *_R1/_R2.fastq(.gz) layout."
  - "Error and chromosome pretrained model files must be supplied separately."
resource_defaults:
  cpu_cores: 40
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 48.0
