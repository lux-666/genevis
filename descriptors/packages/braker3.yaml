package_name: braker3
version_constraint: ">=3.0"
language: cli
install_channel: conda
entry_patterns:
  - "braker.pl --genome={softmasked_genome} --species={species}"
help_summary: "BRAKER3 evidence-aware structural gene annotation candidate."
known_pitfalls:
  - "Species and training assumptions require human approval before execution."
  - "Evidence configuration affects gene model quality and should not be inferred silently."
resource_defaults:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 72.0
