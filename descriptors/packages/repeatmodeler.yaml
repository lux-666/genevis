package_name: repeatmodeler
version_constraint: ">=2.0"
language: cli
install_channel: conda
entry_patterns:
  - "BuildDatabase -name {db_name} {assembly_fasta} && RepeatModeler -database {db_name}"
help_summary: "RepeatModeler de novo repeat family discovery candidate."
known_pitfalls:
  - "Requires a prepared sequence database before RepeatModeler execution."
  - "Discovered libraries usually need masking policy review before downstream use."
resource_defaults:
  cpu_cores: 24
  memory_gb: 96.0
  gpu_required: false
  walltime_hours: 48.0
