package_name: chopper
version_constraint: ">=0.7"
language: cli
install_channel: conda
entry_patterns:
  - "chopper --minlength {min_len} --input {input_fastq} > {output_fastq}"
help_summary: "Long-read filtering command commonly used for Nanopore reads."
known_pitfalls:
  - "Filtering thresholds must be approved before use; no project defaults are assumed."
resource_defaults:
  cpu_cores: 1
  memory_gb: 2.0
  gpu_required: false
  walltime_hours: 2.0
