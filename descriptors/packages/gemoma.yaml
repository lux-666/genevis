package_name: gemoma
version_constraint: ">=1.9"
language: cli
install_channel: conda
entry_patterns:
  - "GeMoMaPipeline threads={threads} outdir={outdir} t={reference_annotation} a={reference_genome} g={target_genome}"
help_summary: "GeMoMa homology-based gene model transfer helper."
known_pitfalls:
  - "Reference genome and annotation choice are biological policy decisions."
resource_defaults:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 36.0
