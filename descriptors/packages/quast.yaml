package_name: quast
version_constraint: ">=5.2"
language: python
install_channel: conda
entry_patterns:
  - "quast.py {assembly} -o {out_dir} --threads {threads}"
  - "quast.py {assembly} -r {reference} -o {out_dir} --threads {threads}"
help_summary: "Quality Assessment Tool for Genome Assemblies."
known_pitfalls:
  - "Reference mode is used only when one reference_genome_fasta asset is registered in the frozen input manifest; otherwise QUAST remains reference-free."
  - "Large genomes require substantial memory for contig alignment."
resource_defaults:
  cpu_cores: 8
  memory_gb: 16.0
  gpu_required: false
  walltime_hours: 4.0
