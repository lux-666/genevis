package_name: filtlong
version_constraint: ">=0.2"
language: cli
install_channel: conda
entry_patterns:
  - "filtlong --min_length {min_len} {input_fastq} > {output_fastq}"
help_summary: "Long-read filtering tool for length and quality based policies."
known_pitfalls:
  - "Filtering thresholds must be approved before use; no project defaults are assumed."
resource_defaults:
  cpu_cores: 1
  memory_gb: 2.0
  gpu_required: false
  walltime_hours: 2.0
