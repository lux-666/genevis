package_name: kofamscan
version_constraint: ">=1.3"
language: cli
install_channel: conda
entry_patterns:
  - "exec_annotation -o {ko_output} {proteins_fasta}"
help_summary: "KofamScan KEGG Orthology assignment candidate."
known_pitfalls:
  - "KOfam profile and KO list versions must be recorded before execution."
  - "Score threshold policy should not be invented by the planner."
resource_defaults:
  cpu_cores: 8
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 24.0
