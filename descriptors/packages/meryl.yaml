package_name: meryl
version_constraint: ">=1.4"
language: cli
install_channel: conda
entry_patterns:
  - "meryl count k={kmer_size} output {output_db} {reads}"
  - "meryl histogram {input_db} > {histogram_tsv}"
help_summary: "Meryl k-mer counting database used by genome survey and Merqury-style workflows."
known_pitfalls:
  - "Requires adequate memory sizing for genome size and read depth."
resource_defaults:
  cpu_cores: 8
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 4.0
