package_name: genomescope2
version_constraint: ">=2.0"
language: cli
install_channel: conda
entry_patterns:
  - "genomescope2 -i {histogram_tsv} -o {output_dir} -k {kmer_size}"
help_summary: "GenomeScope2 model fitting for low-error short-read k-mer histograms."
known_pitfalls:
  - "Model confidence depends on low-error short-read k-mer spectra and fit quality."
resource_defaults:
  cpu_cores: 2
  memory_gb: 8.0
  gpu_required: false
  walltime_hours: 2.0
