package_name: flye
version_constraint: ">=2.9"
language: cli
install_channel: conda
entry_patterns:
  - "flye --nano-raw {reads} --out-dir {output_dir} --threads {threads}"
help_summary: "Long-read de novo assembler candidate for ONT, PacBio CLR, and PacBio HiFi genome projects."
known_pitfalls:
  - "Platform-specific read profile selection needs human approval before execution."
resource_defaults:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 48.0
