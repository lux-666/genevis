package_name: diamond
version_constraint: ">=2.1"
language: cli
install_channel: conda
entry_patterns:
  - "diamond blastp --query {proteins_fasta} --db {database} --out {output_tsv}"
help_summary: "DIAMOND fast protein homology search candidate."
known_pitfalls:
  - "Reference database identity, version, and snapshot date must be recorded before execution."
  - "Sensitivity and e-value policies are human-approved method decisions."
resource_defaults:
  cpu_cores: 16
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 24.0
