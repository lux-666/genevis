package_name: maker
version_constraint: ">=3.01"
language: cli
install_channel: conda
entry_patterns:
  - "maker maker_opts.ctl maker_bopts.ctl maker_exe.ctl"
help_summary: "MAKER integrative gene annotation candidate using masked genome and optional transcript/protein evidence."
known_pitfalls:
  - "Control files encode biological policy and must be reviewed before execution."
  - "Evidence merge behavior should not be selected automatically."
resource_defaults:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 72.0
