package_name: hifiasm
version_constraint: ">=0.21.0"
language: cli
install_channel: conda
entry_patterns:
  - "hifiasm -o {prefix} -t {threads} {reads}"
help_summary: "Assembly candidate commonly used for high-accuracy long reads; retained as a candidate until platform policy is approved."
known_pitfalls:
  - "CycloneSEQ compatibility must be reviewed before real execution."
resource_defaults:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 48.0
