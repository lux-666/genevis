package_name: miniprot
version_constraint: ">=0.13"
language: cli
install_channel: conda
entry_patterns:
  - "miniprot -t {threads} {genome_fasta} {reference_proteins}"
help_summary: "Miniprot protein-to-genome homology evidence candidate."
known_pitfalls:
  - "Reference protein choice affects homology-supported model quality."
  - "Protein evidence should be merged with transcript evidence only under approved policy."
resource_defaults:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 24.0
