package_name: interproscan
version_constraint: ">=5.0"
language: cli
install_channel: conda
entry_patterns:
  - "interproscan.sh -i {proteins_fasta} -f TSV,GFF3 -dp"
help_summary: "InterProScan protein domain, family, motif, and GO annotation candidate."
known_pitfalls:
  - "Database snapshot and member database versions must be recorded before execution."
  - "Runtime and storage requirements vary substantially with protein set size."
resource_defaults:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 48.0
