package_name: isoquant
version_constraint: ">=3.0"
language: cli
install_channel: conda
entry_patterns:
  - "isoquant.py --reference {genome_fasta} --fastq {long_rna_reads} --data_type {data_type}"
help_summary: "IsoQuant long RNA/Iso-Seq transcript structure helper."
known_pitfalls:
  - "Long RNA platform and data type must be declared before execution."
resource_defaults:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 24.0
