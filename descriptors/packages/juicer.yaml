package_name: juicer
version_constraint: ">=1.6"
language: cli
install_channel: container
entry_patterns:
  - "juicer.sh -g {genome_id} -s {enzyme} -z {assembly_fasta} -p {chrom_sizes}"
help_summary: "Juicer Hi-C processing candidate for contact-map generation."
known_pitfalls:
  - "Restriction enzyme and genome metadata require project-specific review."
  - "Outputs usually require downstream 3D-DNA and Juicebox inspection."
resource_defaults:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 24.0
