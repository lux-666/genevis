package_name: jellyfish
version_constraint: ">=2.3"
language: cli
install_channel: conda
entry_patterns:
  - "jellyfish count -C -m {kmer_size} -s {hash_size} -t {threads} {reads} -o {output_jf}"
  - "jellyfish histo -t {threads} {input_jf} > {histogram_tsv}"
help_summary: "Jellyfish k-mer counter for low-error short DNA read genome survey."
known_pitfalls:
  - "Use low-error short DNA reads; do not treat noisy long reads as equivalent GenomeScope input."
resource_defaults:
  cpu_cores: 8
  memory_gb: 16.0
  gpu_required: false
  walltime_hours: 4.0
