package_name: fastplong
version_constraint: ">=0.2"
language: cli
install_channel: conda
entry_patterns:
  - "fastplong --length_required {min_len} -i {input_fastq} -o {output_fastq}"
help_summary: "Long-read preprocessing tool with filtering options."
known_pitfalls:
  - "Filtering thresholds must be approved before use; no project defaults are assumed."
resource_defaults:
  cpu_cores: 2
  memory_gb: 2.0
  gpu_required: false
  walltime_hours: 2.0
