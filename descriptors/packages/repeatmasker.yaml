package_name: repeatmasker
version_constraint: ">=4.1"
language: cli
install_channel: conda
entry_patterns:
  - "RepeatMasker -lib {repeat_library} -gff -xsmall {assembly_fasta}"
help_summary: "RepeatMasker masking candidate for softmasked genome and repeat GFF output."
known_pitfalls:
  - "Library choice strongly affects masking fraction and downstream gene prediction."
  - "Softmasking is preferred for gene annotation unless a human approves hardmasking policy."
resource_defaults:
  cpu_cores: 24
  memory_gb: 96.0
  gpu_required: false
  walltime_hours: 36.0
