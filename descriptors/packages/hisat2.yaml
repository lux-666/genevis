package_name: hisat2
version_constraint: ">=2.2"
language: cli
install_channel: conda
entry_patterns:
  - "hisat2-build {genome_fasta} {index_prefix} && hisat2 -x {index_prefix} -1 {r1} -2 {r2}"
help_summary: "HISAT2 RNA-seq alignment helper for gene annotation evidence planning."
known_pitfalls:
  - "Splice-aware alignment parameters and strandedness should be reviewed before execution."
resource_defaults:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 24.0
