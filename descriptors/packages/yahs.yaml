package_name: yahs
version_constraint: ">=1.2"
language: cli
install_channel: conda
entry_patterns:
  - "yahs {assembly_fasta} {hic_alignments_bam}"
help_summary: "YaHS Hi-C scaffolding candidate for chromosome-level genome assembly."
known_pitfalls:
  - "Requires Hi-C alignment preprocessing and contact-map review before acceptance."
  - "Misjoin correction policy must be approved by a human."
resource_defaults:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 12.0
