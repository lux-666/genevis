package_name: stringtie
version_constraint: ">=2.2"
language: cli
install_channel: conda
entry_patterns:
  - "stringtie {rna_alignment_bam} -o {transcripts_gtf}"
help_summary: "StringTie transcript assembly helper for RNA-seq evidence planning."
known_pitfalls:
  - "Transcript assembly quality depends on RNA-seq alignment and library design."
resource_defaults:
  cpu_cores: 8
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 12.0
