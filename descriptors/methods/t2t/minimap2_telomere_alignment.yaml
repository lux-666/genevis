method_name: t2t.alignment.minimap2
stage: t2t
package_ref: minimap2
parameter_catalog: minimap2
goal: "Map platform-declared long reads to the current assembly for telomere-extension evidence."
required_inputs:
  - name: assembly_fasta
    type: assembly_fasta
    description: "Current Hi-C or assembly-review FASTA candidate."
  - name: long_reads
    type: clean_long_reads
    description: "Registered ONT, PacBio HiFi, CLR, or CycloneSEQ reads; each input retains its platform."
expected_outputs:
  - name: paf
    type: t2t.read_alignment_paf
    description: "Combined long-read-to-assembly alignments in PAF format."
review_rules:
  - "Patch only assembly ends lacking a telomere signal."
  - "Apply the approved support threshold exactly; the adapter adds no hidden safety floor."
  - "Validate an auto-patched candidate before opening the human adoption gate."
human_review_triggers:
  - "Read-tail conflicts, chimeric evidence, or insufficient support leave candidates unpatched."
resource_hints:
  cpu_cores: 16
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 4.0
