method_name: t2t.alignment.minimap2
stage: t2t
package_ref: minimap2
parameter_catalog: minimap2
goal: "Map manifest-declared inputs, build bounded POA candidates, and collect read-back evidence within one frozen execution."
required_inputs:
  - name: assembly_fasta
    type: assembly_fasta
    description: "Current Hi-C or assembly-review FASTA candidate."
  - name: long_reads
    type: clean_long_reads
    description: "Registered ONT, PacBio HiFi, CLR, or CycloneSEQ reads; each input retains its platform."
expected_outputs:
  - name: paf
    type: t2t.read_alignment_paf
    description: "Combined long-read-to-assembly alignments in PAF format."
  - name: reconstruction
    type: t2t.reconstruction
    description: "Candidate plans, implementation profile, budgets and tool versions."
  - name: reconstructed_assembly
    type: t2t.patched_assembly
    description: "Complete candidate output, or source content when no candidate exists."
  - name: readback_validation
    type: t2t.readback_validation
    description: "Same-input consistency measurements bound to the complete candidate SHA-256."
  - name: readback_paf
    type: t2t.read_alignment_paf
    description: "Mappings against the complete candidate output."
  - name: representative_baseline
    type: t2t.representative_baseline
    description: "Comparator inputs; may be empty when no candidate exists."
  - name: consensus_extensions
    type: t2t.consensus_extensions
    description: "Constructed candidate segments; may be empty when no candidate exists."
review_rules:
  - "Patch only assembly ends lacking a telomere signal."
  - "Use the approved support count and record additional clustering rules and compute budgets."
  - "Zero-wait adopts structurally valid outputs; quality warnings remain advisory."
  - "Missing or inconsistent execution outputs are errors, not successful source retention."
  - "Validate an auto-patched candidate before opening the human adoption gate."
human_review_triggers:
  - "Read-tail conflicts, chimeric evidence, or insufficient support leave candidates unpatched."
resource_hints:
  cpu_cores: 16
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 4.0
