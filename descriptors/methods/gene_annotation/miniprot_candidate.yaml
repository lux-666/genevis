method_name: gene_annotation.candidate.miniprot
stage: gene_annotation
package_ref: miniprot
goal: "Plan Miniprot protein homology evidence mapping without execution."
category: homology
recommended_default: true_if_protein_reference_available
required_inputs:
  - name: genome_fasta_ref
    type: softmasked_genome
    description: "Softmasked genome FASTA from repeat annotation."
  - name: protein_reference_fasta
    type: reference_proteins
    description: "Reference protein FASTA evidence."
optional_inputs:
  - name: repeat_masked_genome_ref
    type: softmasked_genome
    description: "Optional repeat-masked genome."
    required: false
expected_outputs:
  - name: protein_homology_gff
    type: gene_models
    description: "Planned protein-supported gene model evidence."
materialize_outputs:
  - annotation.gff3
  - proteins.fa
  - cds.fa
readiness_rules:
  - require_protein_reference_fasta_exists
  - require_protein_reference_taxon_scope
  - warn_if_reference_is_too_distant
review_notes:
  - fast
  - good_first_homology_candidate
  - quality_depends_on_reference_proteins
evm:
  # miniprot --gff emits gene models (mRNA/CDS), not protein_match alignment
  # features, so it feeds EVM via --gene_predictions (OTHER_PREDICTION), not
  # --protein_alignments which expects protein-spliced-alignment GFF3.
  evidence_class: OTHER_PREDICTION
  source_type: miniprot
review_rules:
  - protein_homology_plan_exists
human_review_triggers:
  - protein_reference_policy_required
  - evidence_merge_policy_required
resource_hints:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 24.0
