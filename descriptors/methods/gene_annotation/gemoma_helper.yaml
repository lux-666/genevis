method_name: gene_annotation.helper.gemoma
stage: gene_annotation
package_ref: gemoma
goal: "Plan GeMoMa homology-based gene model transfer without execution."
required_inputs:
  - name: reference_proteins
    type: reference_proteins
    description: "Reference protein or homology evidence."
  - name: softmasked_genome
    type: softmasked_genome
    description: "Softmasked genome FASTA from repeat annotation."
expected_outputs:
  - name: homology_gene_models
    type: gene_models
    description: "Planned homology-supported gene models."
review_rules:
  - homology_evidence_plan_exists
human_review_triggers:
  - homology_reference_policy_required
  - evidence_merge_policy_required
resource_hints:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 36.0
