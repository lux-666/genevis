method_name: gene_annotation.helper.isoquant
stage: gene_annotation
package_ref: isoquant
goal: "Plan IsoQuant long RNA/Iso-Seq transcript evidence without execution."
required_inputs:
  - name: long_rna_reads
    type: raw_isoseq_or_long_rna_reads
    description: "Iso-Seq or long RNA reads for transcript structure evidence."
  - name: softmasked_genome
    type: softmasked_genome
    description: "Softmasked genome FASTA from repeat annotation."
expected_outputs:
  - name: long_rna_transcript_models
    type: gene_models
    description: "Planned long-RNA transcript model evidence."
review_rules:
  - long_rna_evidence_plan_exists
human_review_triggers:
  - long_rna_data_type_policy_required
resource_hints:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 24.0
