method_name: gene_annotation.candidate.genewise
stage: gene_annotation
package_ref: genewise
goal: "High-accuracy protein-to-genome alignment for difficult genes."
category: homology_high_accuracy
execution_status: deferred
recommended_default: false
required_inputs:
  - name: genome_fasta_ref
    type: softmasked_genome
    description: "Target genome FASTA."
  - name: protein_reference_fasta
    type: reference_proteins
    description: "Reference protein FASTA."
  - name: blast_or_exonerate_hits_ref
    type: homology_hits
    description: "Pre-filtered BLAST/exonerate hits bounding the search."
expected_outputs:
  - name: genewise_gff
    type: gene_models
    description: "GeneWise gene models (convertible to GFF3)."
materialize_outputs:
  - annotation.gff3
  - proteins.fa
  - cds.fa
readiness_rules:
  - require_protein_reference_fasta_exists
  - require_hit_filtering_policy
review_notes:
  - slow
  - high_accuracy
  - high_resource_and_storage_cost
  - useful_for_rescuing_difficult_genes
evm:
  evidence_class: PROTEIN
  source_type: genewise
review_rules:
  - homology_evidence_plan_exists
human_review_triggers:
  - homology_reference_policy_required
resource_hints:
  cpu_cores: 16
  memory_gb: 64.0
  gpu_required: false
  walltime_hours: 72.0
