method_name: assembly.candidate.canu
stage: assembly
package_ref: canu
goal: "Plan a Canu candidate assembly bundle without executing Canu."
required_inputs:
  - name: long_reads
    type: clean_long_reads
    description: "Clean long reads or an approved long-read FOFN."
  - name: genome_size
    type: genome_survey_result
    description: "Genome size prior from survey or human input."
expected_outputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Planned draft assembly FASTA path for the Canu candidate."
review_rules:
  - candidate_bundle_exists
human_review_triggers:
  - genome_size_required
  - cycloneseq_platform_profile_required
resource_hints:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 72.0
