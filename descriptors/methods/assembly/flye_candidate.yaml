method_name: assembly.candidate.flye
stage: assembly
package_ref: flye
goal: "Plan a Flye candidate assembly bundle without executing Flye."
required_inputs:
  - name: long_reads
    type: clean_long_reads
    description: "Clean long reads or an approved long-read FOFN."
expected_outputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Planned draft assembly FASTA path for the Flye candidate."
review_rules:
  - candidate_bundle_exists
human_review_triggers:
  - cycloneseq_platform_profile_required
resource_hints:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 48.0
