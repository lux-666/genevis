method_name: assembly.candidate.hifiasm
stage: assembly
package_ref: hifiasm
parameter_catalog: hifiasm
goal: "Plan and optionally execute a hifiasm assembly candidate for HiFi assembly routes."
required_inputs:
  - name: long_reads
    type: clean_long_reads
    description: "Clean HiFi reads (FASTA or FASTQ)."
optional_inputs:
  - name: ultralong_reads
    type: clean_long_reads
    description: "ONT ultra-long companion reads passed with --ul."
  - name: hic_r1_reads
    type: hic_reads_registered
    description: "Ordered Hi-C R1 lane files passed with --h1."
  - name: hic_r2_reads
    type: hic_reads_registered
    description: "Ordered Hi-C R2 lane files passed with --h2."
expected_outputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Draft assembly FASTA path for the hifiasm candidate when local execution is enabled."
review_rules:
  - candidate_bundle_exists
  - compatibility_route_explicitly_requested
human_review_triggers:
  - explicit_hifi_or_non_ont_route_required
resource_hints:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 48.0
