method_name: assembly.candidate.hifiasm
stage: assembly
package_ref: hifiasm
goal: "Plan and optionally execute a hifiasm assembly candidate for explicit HiFi/non-ONT assembly routes."
required_inputs:
  - name: long_reads
    type: clean_long_reads
    description: "Clean HiFi-compatible reads or an explicitly approved non-ONT long-read FOFN."
expected_outputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Draft assembly FASTA path for the hifiasm candidate when local execution is enabled."
review_rules:
  - candidate_bundle_exists
  - compatibility_route_explicitly_requested
human_review_triggers:
  - explicit_hifi_or_non_ont_route_required
resource_hints:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 48.0
