method_name: hic_scaffolding.candidate.juicer_3ddna_juicebox
stage: hic_scaffolding
package_ref: juicer
goal: "Execute a Juicer plus 3D-DNA chromosome-scaffolding candidate through the frozen-attempt lifecycle, then require Juicebox review."
required_inputs:
  - name: final_assembly
    type: draft_assembly
    description: "Reviewed assembly FASTA before Hi-C scaffolding."
  - name: hic_reads
    type: hic_reads_registered
    description: "Registered paired Hi-C reads for Juicer, or a materialized merged_nodups.txt handoff for direct 3D-DNA."
optional_inputs:
  - name: merged_nodups
    type: hic_merged_nodups
    description: "Materialized Juicer merged_nodups.txt; when present, Juicer is bypassed and 3D-DNA runs directly."
expected_outputs:
  - name: chromosome_scaffolded_assembly
    type: chromosome_scaffolded_assembly
    description: "Planned chromosome-level assembly output path."
  - name: juicebox_review_bundle
    type: juicebox_review_bundle
    description: "Planned contact-map review bundle."
review_rules:
  - juicebox_review_bundle_exists
human_review_triggers:
  - contact_map_policy_required
  - default_hic_path_required
resource_hints:
  cpu_cores: 32
  memory_gb: 128.0
  gpu_required: false
  walltime_hours: 24.0
