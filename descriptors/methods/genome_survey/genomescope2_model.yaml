method_name: genome_survey.model.genomescope2
stage: genome_survey
package_ref: genomescope2
goal: "Plan GenomeScope2 modeling from a Jellyfish or Meryl k-mer histogram."
required_inputs:
  - name: kmer_histogram
    type: genome_survey_result
    description: "K-mer histogram generated from the selected DNA reads."
expected_outputs:
  - name: genome_survey_result
    type: genome_survey_result
    description: "Genome size, heterozygosity, repeat fraction, and model confidence."
review_rules:
  - genome_survey_result_exists
human_review_triggers:
  - low_model_fit
  - abnormal_kmer_spectrum
resource_hints:
  cpu_cores: 2
  memory_gb: 8.0
  gpu_required: false
  walltime_hours: 2.0
