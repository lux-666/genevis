method_name: genome_survey.kmer_count.meryl
stage: genome_survey
package_ref: meryl
goal: "Plan Meryl k-mer counting for low-error short DNA read genome survey."
required_inputs:
  - name: clean_short_dna_reads
    type: clean_short_dna_reads
    description: "Clean low-error short DNA reads."
expected_outputs:
  - name: kmer_histogram
    type: genome_survey_result
    description: "Meryl histogram or database summary for genome survey modeling."
review_rules:
  - kmer_histogram_exists
human_review_triggers:
  - abnormal_kmer_spectrum
resource_hints:
  cpu_cores: 8
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 4.0
