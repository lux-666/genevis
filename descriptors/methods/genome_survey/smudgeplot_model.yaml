method_name: genome_survey.model.smudgeplot
stage: genome_survey
package_ref: smudgeplot
goal: "Plan Smudgeplot support for k-mer based ploidy and heterozygosity review."
required_inputs:
  - name: kmer_pairs
    type: genome_survey_result
    description: "Short-read k-mer pair coverage material derived from a k-mer counter."
expected_outputs:
  - name: genome_survey_result
    type: genome_survey_result
    description: "Smudgeplot-derived support tables and plots referenced from survey result."
review_rules:
  - smudgeplot_outputs_exist
human_review_triggers:
  - ambiguous_ploidy_signal
resource_hints:
  cpu_cores: 4
  memory_gb: 8.0
  gpu_required: false
  walltime_hours: 2.0
