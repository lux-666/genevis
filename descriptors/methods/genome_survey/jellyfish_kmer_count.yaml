method_name: genome_survey.kmer_count.jellyfish
stage: genome_survey
package_ref: jellyfish
goal: "Plan Jellyfish k-mer counting for genome survey from available DNA reads."
required_inputs:
  - name: dna_reads
    type: raw_or_clean_short_or_long_dna_reads
    description: "Raw or clean short/long DNA reads selected for k-mer survey."
expected_outputs:
  - name: kmer_histogram
    type: genome_survey_result
    description: "K-mer histogram input for genome survey modeling."
review_rules:
  - kmer_histogram_exists
human_review_triggers:
  - abnormal_kmer_spectrum
resource_hints:
  cpu_cores: 8
  memory_gb: 16.0
  gpu_required: false
  walltime_hours: 4.0
planner:
  required_parameters:
    - kmer_size
    - hash_size
    - threads
  parameter_defaults:
    kmer_size: 21
    hash_size: 1G
    threads: 4
