method_name: repeat_annotation.masking.repeatmasker
stage: repeat_annotation
package_ref: repeatmasker
goal: "Plan RepeatMasker softmasking and support explicit opt-in local RepeatMasker execution with a provided repeat library."
required_inputs:
  - name: final_assembly_for_annotation
    type: draft_assembly
    description: "Reviewed assembly FASTA for masking."
  - name: repeat_library
    type: repeat_library
    description: "Provided repeat library for local RepeatMasker execution; planned de novo libraries remain deferred until materialized."
expected_outputs:
  - name: softmasked_genome
    type: softmasked_genome
    description: "Softmasked genome FASTA for gene annotation; materialized when local RepeatMasker execution is enabled."
  - name: repeat_annotation_gff3
    type: repeat_annotation
    description: "Repeat annotation GFF3; materialized when local RepeatMasker execution is enabled."
review_rules:
  - repeat_masking_plan_exists
human_review_triggers:
  - masking_policy_required
  - low_confidence_repeat_annotation
resource_hints:
  cpu_cores: 24
  memory_gb: 96.0
  gpu_required: false
  walltime_hours: 36.0
