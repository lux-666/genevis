method_name: assembly_review.eval.quast
stage: assembly_review
package_ref: quast
goal: "Evaluate assembly contiguity with reference-free QUAST basic reports before human review."
required_inputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Draft assembly FASTA to evaluate."
expected_outputs:
  - name: quast_report
    type: quast_report
    description: "Reference-free QUAST basic report files, including report.tsv when local execution is enabled."
review_rules:
  - quast_report_exists
human_review_triggers:
  - quast_threshold_not_approved
resource_hints:
  cpu_cores: 8
  memory_gb: 16.0
  gpu_required: false
  walltime_hours: 4.0
