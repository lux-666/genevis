method_name: assembly_review.eval.quast
stage: assembly_review
package_ref: quast
goal: "Evaluate assembly contiguity with QUAST before human review, using a per-run reference genome when one is registered."
required_inputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Draft assembly FASTA to evaluate."
expected_outputs:
  - name: quast_report
    type: quast_report
    description: "QUAST report files, including report.tsv when execution is enabled."
optional_inputs:
  - name: reference_genome
    type: reference_genome_fasta
    description: "One manifest-registered reference genome FASTA for QUAST -r mode."
review_rules:
  - quast_report_exists
human_review_triggers:
  - quast_threshold_not_approved
resource_hints:
  cpu_cores: 8
  memory_gb: 16.0
  gpu_required: false
  walltime_hours: 4.0
planner:
  required_parameters:
    - threads
  parameter_defaults:
    threads: 4
