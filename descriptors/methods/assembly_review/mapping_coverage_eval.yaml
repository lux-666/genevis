method_name: assembly_review.eval.mapping_coverage
stage: assembly_review
package_ref: minimap2
goal: "Map reads back to assembly and compute per-contig coverage."
required_inputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Draft assembly FASTA."
  - name: clean_long_reads
    type: clean_long_reads
    description: "Clean long reads for alignment."
expected_outputs:
  - name: coverage_bam
    type: coverage_bam
    description: "Sorted BAM of reads mapped to assembly."
  - name: coverage_stats
    type: coverage_stats
    description: "Per-contig depth statistics."
review_rules:
  - coverage_stats_exist
human_review_triggers:
  - coverage_anomaly_detected
resource_hints:
  cpu_cores: 16
  memory_gb: 32.0
  gpu_required: false
  walltime_hours: 4.0
