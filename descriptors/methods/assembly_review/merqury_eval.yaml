method_name: assembly_review.eval.merqury
stage: assembly_review
package_ref: merqury
goal: "Evaluate assembly quality and completeness with Merqury k-mer spectra."
required_inputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Draft assembly FASTA to evaluate."
  - name: clean_short_dna_reads
    type: clean_short_dna_reads
    description: "Accurate short reads for k-mer database."
expected_outputs:
  - name: merqury_report
    type: merqury_report
    description: "Merqury QV, completeness, and copy-number plots."
review_rules:
  - merqury_report_exists
human_review_triggers:
  - merqury_threshold_not_approved
resource_hints:
  cpu_cores: 8
  memory_gb: 16.0
  gpu_required: false
  walltime_hours: 4.0
