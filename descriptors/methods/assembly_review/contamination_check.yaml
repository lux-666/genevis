method_name: assembly_review.check.contamination
stage: assembly_review
package_ref: minimap2
goal: "Screen assembly for contamination using reference database alignment."
required_inputs:
  - name: draft_assembly
    type: draft_assembly
    description: "Draft assembly FASTA."
expected_outputs:
  - name: contamination_report
    type: contamination_report
    description: "Summary of contigs flagged as potential contamination."
review_rules:
  - contamination_report_exists
human_review_triggers:
  - contamination_policy_not_defined
resource_hints:
  cpu_cores: 8
  memory_gb: 16.0
  gpu_required: false
  walltime_hours: 2.0
