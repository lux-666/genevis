catalog_id: hic_scaffolding.candidate.autohic
method_id: hic_scaffolding.candidate.autohic
tool: AutoHiC
description: "Sparse AutoHiC biological/configuration recommendation surface. Runtime and model paths are resolved outside the LLM recommendation."

parameters:
  restriction_enzyme:
    value_type: string
    application:
      kind: config_key
      key: restriction_enzyme
    layers:
      l2:
        adjustable: true
    description: "Restriction enzyme used to prepare the selected Hi-C library."
    notes: "The LLM proposes this value and every proposal requires human approval."

  number_of_edit_rounds:
    value_type: int
    application:
      kind: config_key
      key: number_of_edit_rounds
    layers:
      l2:
        adjustable: true
    description: "Number of AutoHiC edit rounds."

  translocation_adjust:
    value_type: boolean
    application:
      kind: config_key
      key: translocation_adjust
    layers:
      l2:
        adjustable: true
    description: "Whether AutoHiC applies translocation adjustment."

  inversion_adjust:
    value_type: boolean
    application:
      kind: config_key
      key: inversion_adjust
    layers:
      l2:
        adjustable: true
    description: "Whether AutoHiC applies inversion adjustment."

  debris_adjust:
    value_type: boolean
    application:
      kind: config_key
      key: debris_adjust
    layers:
      l2:
        adjustable: true
    description: "Whether AutoHiC applies debris adjustment."

  error_max_epoch:
    value_type: int
    application:
      kind: config_key
      key: error_max_epoch
    layers:
      l2:
        adjustable: true
    description: "Maximum error-detection training epochs."

  error_min_len:
    value_type: int
    application:
      kind: config_key
      key: error_min_len
    layers:
      l2:
        adjustable: true
    description: "Minimum sequence length considered by error detection."

  error_max_len:
    value_type: int
    application:
      kind: config_key
      key: error_max_len
    layers:
      l2:
        adjustable: true
    description: "Maximum sequence length considered by error detection."

  error_filter_score:
    value_type: float
    application:
      kind: config_key
      key: error_filter_score
    layers:
      l2:
        adjustable: true
    description: "AutoHiC error confidence filter score."

  error_filter_iou_score:
    value_type: float
    application:
      kind: config_key
      key: error_filter_iou_score
    layers:
      l2:
        adjustable: true
    description: "AutoHiC error intersection-over-union filter score."
