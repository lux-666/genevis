catalog_id: minimap2
method_id: t2t.alignment.minimap2
tool: Gene Agent T2T finishing
description: "Baseline defaults and patch mode for T2T finishing."

parameters:
  mode:
    value_type: string
    allowed_values:
      - propose_only
      - manual_review
      - auto_patch
    application:
      kind: stage_value
      key: mode
    required_for_execution: true
    layers:
      l0:
        kind: runtime
        binding: t2t_mode
        required: false
        materialized_default: auto_patch
    description: "T2T patching policy; the catalog owns the default."

  min_motif_copies:
    value_type: int
    application:
      kind: stage_value
      key: min_motif_copies
    required_for_execution: true
    layers:
      l0:
        kind: materialized_default
        value: 4
    description: "Minimum consecutive telomere motif copies in a terminal window or read tail."

  terminal_window_bp:
    value_type: int
    application:
      kind: stage_value
      key: terminal_window_bp
    required_for_execution: true
    layers:
      l0:
        kind: materialized_default
        value: 10000
    description: "Number of terminal bases inspected for telomere signal."

  min_mapq:
    value_type: int
    application:
      kind: stage_value
      key: min_mapq
    required_for_execution: true
    layers:
      l0:
        kind: materialized_default
        value: 20
    description: "Minimum mapping quality for a patch candidate."

  max_target_terminal_distance_bp:
    value_type: int
    application:
      kind: stage_value
      key: max_target_terminal_distance_bp
    required_for_execution: true
    layers:
      l0:
        kind: materialized_default
        value: 1000
    description: "Maximum target bases replaced between the alignment junction and terminus."

  min_overlap_bp:
    value_type: int
    application:
      kind: stage_value
      key: min_overlap_bp
    required_for_execution: true
    layers:
      l0:
        kind: materialized_default
        value: 500
    description: "Minimum aligned query overlap supporting a patch candidate."

  min_supporting_reads:
    value_type: int
    application:
      kind: stage_value
      key: min_supporting_reads
    required_for_execution: true
    layers:
      l0:
        kind: materialized_default
        value: 1
    description: "Minimum compatible reads supporting the selected tail."
