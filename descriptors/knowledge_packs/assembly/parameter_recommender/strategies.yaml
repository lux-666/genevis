version: 1
default_strategy: structured_default
hifiasm_numeric:
  candidate_budget: 12
  weak_coverage_threshold: 0.6
  distance_clip: 4.0
  epsilon: 0.000001
  scales:
    genome_size_mb: 0.6931471805599453
    coverage: 0.6931471805599453
    read_n50_kb: 0.6931471805599453
    heterozygosity: 0.6931471805599453
    ploidy: 1.0
  weights:
    genome_size_mb: 1.0
    coverage: 1.0
    read_n50_kb: 1.0
    heterozygosity: 1.0
    ploidy: 1.0
strategies:
  structured_default:
    hard_filters:
      read_type_mismatch: true
      exclude_failure_cases_for_initial: true
    scoring_weights:
      method_exact_match: 8
      method_family_match: 3
      read_type_match: 8
      failure_mode_match: 5
      clade_match: 2
      coverage_bucket_match: 2
      genome_size_bucket_match: 2
      heterozygosity_bucket_match: 2
      read_n50_bucket_match: 1
    buckets:
      coverage: [30, 60]
      genome_size_mb: [500, 3000, 10000]
      read_n50_kb: [15, 30, 50]
