guidance:
  - guidance_id: flye.disjointigs.coverage.v1
    methods: [assembly.candidate.flye]
    parameters: [asm_coverage]
    relevant_metrics: [read_qc.raw_coverage, read_qc.read_n50]
    guidance: >-
      asm_coverage selects a subset of the longest reads for initial disjointig
      assembly to reduce memory use; it is not a final assembly coverage target.
      Consider it only with a supported genome-size estimate and enough effective
      coverage. Omission keeps the tool default rather than inheriting a prior retry.
    caveats:
      - Nominal coverage does not establish uniform coverage or read quality.
      - Subsampling limited coverage can remove support for genuine sequence.
      - "Source: https://github.com/fenderglass/Flye/blob/flye/docs/USAGE.md#parameter-descriptions ; historical version equivalence is not established."

  - guidance_id: flye.overlaps.connectivity.v1
    methods: [assembly.candidate.flye]
    parameters: [min_overlap]
    relevant_metrics: [read_qc.read_n50, read_qc.raw_coverage, genome_survey.repeat_fraction]
    guidance: >-
      Flye normally chooses minimum overlap from the read-length distribution.
      Raising it can simplify repeat-graph connectivity but can also introduce
      assembly gaps. Diagnose read length, effective coverage and fragmentation
      before overriding the default; a global repeat fraction does not locate repeats.
    caveats:
      - The selected nano-raw, nano-hq, pacbio-raw or pacbio-hifi mode is frozen input identity, not an adjustable recommendation.
      - Short or low-quality reads may not support the proposed overlap length.
      - "Source: https://github.com/fenderglass/Flye/blob/flye/docs/USAGE.md#parameter-descriptions ; historical version equivalence is not established."

  - guidance_id: nextdenovo.reads.cutoff.v1
    methods: [assembly.candidate.nextdenovo]
    parameters: [read_cutoff]
    relevant_metrics: [read_qc.read_n50, read_qc.raw_coverage]
    guidance: >-
      read_cutoff excludes shorter reads before NextDenovo assembly. Increasing
      it changes retained coverage as well as read length; justify a cutoff using
      the observed length distribution and remaining support. The adapter fixes
      task=all and input_type=raw. In NextDenovo v2.5.2 this executes correction
      for ONT, CLR and HiFi, including HiFi self-correction; read_type=hifi does
      not skip the correction workflow.
    caveats:
      - Read N50 alone cannot quantify coverage remaining after a cutoff.
      - The executor freezes read_type and input FOFN; recommendations cannot change either.
      - Corrected input is not supported by this adapter; behavior in other allowed tool versions requires verification.
      - "Source: https://github.com/Nextomics/NextDenovo/blob/v2.5.2/nextDenovo ; https://github.com/Nextomics/NextDenovo/blob/v2.5.2/doc/OPTION.rst ; version equivalence is not established."

  - guidance_id: hifiasm.connectivity.low_coverage.v1
    methods: [assembly.candidate.hifiasm, assembly.candidate.hifiasm_ont]
    parameters:
      - max_overlaps_per_read
      - high_freq_kmer_drop
      - min_overlap_drop_ratio
      - max_overlap_drop_ratio
    relevant_metrics:
      - read_qc.raw_coverage
      - read_qc.read_n50
    guidance: >-
      Low effective read coverage leaves fewer supported overlaps and can make
      the assembly graph fragile. Consider overlap retention, high-frequency
      seed filtering, and graph cleaning together so that filtering does not
      remove the limited connectivity still supported by the reads.
    caveats:
      - Low coverage cannot always be repaired by parameter tuning; additional data may be needed.
      - Read length and quality determine whether nominal coverage contributes useful overlaps.

  - guidance_id: hifiasm.purging.heterozygosity.v1
    methods: [assembly.candidate.hifiasm, assembly.candidate.hifiasm_ont]
    parameters:
      - purge_level
      - purge_similarity
      - purge_max
    relevant_metrics:
      - genome_survey.heterozygosity
      - genome_survey.repeat_fraction
    guidance: >-
      Heterozygous sequence and duplicated sequence can produce similar graph
      signals. Consider purging settings as a group, balancing removal of true
      duplicate haplotigs against preservation of genuine haplotype divergence.
    caveats:
      - Genome-survey estimates are population-level summaries and may not describe every locus.
      - Initial recommendations should remain conservative when no assembly review is available.

  - guidance_id: hifiasm.repeats.graph_handling.v1
    methods: [assembly.candidate.hifiasm, assembly.candidate.hifiasm_ont]
    parameters:
      - kmer_length
      - high_freq_kmer_drop
      - max_overlaps_per_read
      - assembly_cleaning_rounds
    relevant_metrics:
      - genome_survey.repeat_fraction
      - read_qc.raw_coverage
      - read_qc.read_n50
    guidance: >-
      Repeat-rich samples can create high-frequency seeds, ambiguous overlaps,
      and complex graph structures. Interpret seed frequency controls, overlap
      retention, and graph cleaning jointly rather than treating any one knob
      as a complete repeat-resolution strategy.
    caveats:
      - A global repeat fraction does not identify the lengths or identities of the repeats.
      - Aggressive filtering or cleaning can also remove valid low-support sequence.

  - guidance_id: hifiasm.retry.over_purging.v1
    methods: [assembly.candidate.hifiasm, assembly.candidate.hifiasm_ont]
    parameters:
      - purge_level
      - purge_similarity
      - purge_max
    relevant_metrics:
      - assembly_review.assembly_size_ratio
      - assembly_review.busco_missing
      - previous_attempt.params.purge_level
      - previous_attempt.params.purge_similarity
    guidance: >-
      When review indicates that the previous assembly may have removed genuine
      sequence, reconsider the aggressiveness of the previous purging settings
      and change only the smallest coherent group of related parameters.
    caveats:
      - Small assembly size or missing genes can also result from low coverage, contamination filtering, or fragmentation.
      - Diagnose the failure mode before attributing it to purging.

  - guidance_id: hifiasm.retry.under_purging.v1
    methods: [assembly.candidate.hifiasm, assembly.candidate.hifiasm_ont]
    parameters:
      - purge_level
      - purge_similarity
      - purge_max
    relevant_metrics:
      - assembly_review.assembly_size_ratio
      - assembly_review.busco_duplicate
      - previous_attempt.params.purge_level
      - previous_attempt.params.purge_similarity
    guidance: >-
      When review indicates retained haplotig duplication, reconsider the
      previous purging settings as a connected group and use the observed
      quality signals to justify the retry attempt's explicit mapping.
    caveats:
      - Biological duplication and polyploidy can resemble under-purging.
      - Increased assembly size or duplicated BUSCO alone is not a sufficient diagnosis.
