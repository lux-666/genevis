    case_type: initial
    source:
      kind: paper
      title: "Telomere-to-telomere genome assembly of a male goat reveals variants associated with cashmere traits"
      doi: 10.1038/s41467-024-54188-z
      year: 2024
    methods_path: cases/hifiasm/papers/s41467-024-54188-z/methods.md
    evidence_spans:
      - span_id: scenario.goat_t2t
        quote: "The male-goat T2T workflow combines PacBio HiFi and ultra-long ONT reads with Hi-C, Bionano optical maps, and parental short reads."
      - span_id: command.hifi_initial
        quote: "The authors' repository reports hifiasm 0.16.1 with an output prefix, 40 threads, and four HiFi inputs for the initial assembly."
      - span_id: command.trio
        quote: "Parental reads were counted with yak at k=23 and bloom-filter setting 37, then supplied to a trio hifiasm run through -1 and -2."
      - span_id: rationale.finishing
        quote: "Bionano and Hi-C organized chromosomes, while parent-specific k-mers and binned ONT or HiFi reads supported haplotype assembly and gap filling."
      - span_id: caveat.parameter_scope
        quote: "Output prefixes, thread counts, input paths, trio yak files, and auxiliary data are route or execution context rather than adjustable hifiasm L2 evidence."
