catalog_id: hifiasm
method_id: hifiasm
tool: hifiasm
description: "HiFi assembly mode using hifiasm >=0.21.0; CLI surface derived from upstream help/CommandLines.cpp."

parameters:
  output_prefix:
    value_type: path
    application:
      kind: cli_option
      flag: "-o"
      order: 0
    layers:
      l0:
        kind: runtime
        binding: assembly_output_prefix
    description: "Output file prefix."

  threads:
    value_type: int
    application:
      kind: cli_option
      flag: "-t"
      order: 1
    min: 1
    layers:
      l0:
        kind: runtime
        binding: assembly_threads
        required: false
        materialized_default: 32
    description: "Number of CPU threads."

  input_reads:
    value_type: path_list
    application:
      kind: positional
      position: 0
    layers:
      l0:
        kind: runtime
        binding: assembly_input_reads
    description: "Input HiFi read files."

  help:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "-h"
      order: 2
    layers:
      l0:
        kind: fixed
        value: false
    description: "Show help information."

  version:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--version"
      order: 3
    layers:
      l0:
        kind: fixed
        value: false
    description: "Show version number."

  ignore_cached_overlaps:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "-i"
      order: 4
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Ignore saved read correction and overlaps."

  write_paf:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--write-paf"
      order: 5
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Dump overlaps in PAF; output/audit mechanic."

  write_ec:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--write-ec"
      order: 6
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Dump error-corrected reads; output/audit mechanic."

  dbg_gfa:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--dbg-gfa"
      order: 7
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Debug GFA output."

  dbg_het_cnt:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--dbg-het-cnt"
      order: 8
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Debug heterozygous k-mer count output."

  dbg_ovec:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--dbg-ovec"
      order: 9
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Debug overlap error correction output."

  prt_raw:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--prt-raw"
      order: 10
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Print raw/debug output."

  bin_only:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--bin-only"
      order: 11
    layers:
      l0:
        kind: materialized_default
        value: false
    description: "Internal/debug binary-only mode."

  primary_mode:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--primary"
      order: 12
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Output primary and alternate contigs; route/output contract."

  hap1_yak:
    value_type: path
    application:
      kind: cli_option
      flag: "-1"
      order: 13
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Paternal/haplotype1 yak k-mer dump for trio route."

  hap2_yak:
    value_type: path
    application:
      kind: cli_option
      flag: "-2"
      order: 14
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Maternal/haplotype2 yak k-mer dump for trio route."

  hap1_read_names:
    value_type: path
    application:
      kind: cli_option
      flag: "-3"
      order: 15
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Haplotype1 read-name list for trio route."

  hap2_read_names:
    value_type: path
    application:
      kind: cli_option
      flag: "-4"
      order: 16
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Haplotype2 read-name list for trio route."

  hic_r1:
    value_type: path_list
    application:
      kind: cli_option
      flag: "--h1"
      order: 17
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Hi-C R1 input files."

  hic_r2:
    value_type: path_list
    application:
      kind: cli_option
      flag: "--h2"
      order: 18
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Hi-C R2 input files."

  hic_enzyme:
    value_type: string
    application:
      kind: cli_option
      flag: "--enzyme"
      order: 19
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Hi-C restriction enzyme route input."

  ul_reads:
    value_type: path_list
    application:
      kind: cli_option
      flag: "--ul"
      order: 20
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Ultra-long read inputs for hybrid route."

  secondary_input:
    value_type: path
    application:
      kind: cli_option
      flag: "--sec-in"
      order: 21
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
        required: false
    description: "Secondary input route file."

  ont_mode:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--ont"
      order: 22
    layers:
      l0:
        kind: fixed
        value: false
    description: "ONT mode is fixed off for the HiFi method."

  seed:
    value_type: int
    application:
      kind: cli_option
      flag: "--seed"
      order: 23
    min: 0
    layers:
      l0:
        kind: materialized_default
        value: 11
    description: "RNG seed for reproducibility."

  hg_size:
    value_type: string
    application:
      kind: cli_option
      flag: "--hg-size"
      order: 100
    layers:
      l1:
        fact: effective_genome_size_bp
        transform: hifiasm_hg_size
    description: "Estimated haploid genome size, e.g. 100m or 3g."

  hom_cov:
    value_type: int
    application:
      kind: cli_option
      flag: "--hom-cov"
      order: 101
    min: 1
    layers:
      l1:
        fact: raw_coverage_x
        transform: identity
    description: "Homozygous read coverage; omitted until a producer publishes this measurement."

  n_hap:
    value_type: int
    application:
      kind: cli_option
      flag: "--n-hap"
      order: 102
    allowed_values: [1, 2, 3, 4, 5, 6, 8]
    layers:
      l0:
        kind: materialized_default
        value: 2
    description: "Assumed haplotype count; omitted unless a future typed producer is added."

  kmer_length:
    value_type: int
    application:
      kind: cli_option
      flag: "-k"
      order: 200
    min: 11
    max: 63
    layers:
      l2:
        adjustable: true
    description: "K-mer length; hifiasm requires <64."

  minimizer_window:
    value_type: int
    application:
      kind: cli_option
      flag: "-w"
      order: 201
    min: 1
    max: 500
    layers:
      l2:
        adjustable: true
    description: "Minimizer window size."

  bloom_filter_bits:
    value_type: int
    application:
      kind: cli_option
      flag: "-f"
      order: 202
    min: 0
    max: 45
    layers:
      l2:
        adjustable: true
    description: "Number of bits for the bloom filter; 0 disables it."

  high_freq_kmer_drop:
    value_type: float
    application:
      kind: cli_option
      flag: "-D"
      order: 203
    min: 0
    max: 100
    layers:
      l2:
        adjustable: true
    description: "Drop k-mers occurring above FLOAT*coverage."

  max_overlaps_per_read:
    value_type: int
    application:
      kind: cli_option
      flag: "-N"
      order: 204
    min: 1
    max: 1000000
    layers:
      l2:
        adjustable: true
    description: "Consider up to max(-D*coverage, -N) overlaps per oriented read."

  correction_rounds:
    value_type: int
    application:
      kind: cli_option
      flag: "-r"
      order: 205
    min: 0
    max: 20
    layers:
      l2:
        adjustable: true
    description: "Rounds of haplotype-aware error correction."

  adapter_trim_length:
    value_type: int
    application:
      kind: cli_option
      flag: "-z"
      order: 206
    min: 0
    max: 1000
    layers:
      l2:
        adjustable: true
    description: "Trim this many bases from both ends of reads."

  max_kmer_occurrence:
    value_type: int
    application:
      kind: cli_option
      flag: "--max-kocc"
      order: 207
    min: 1
    max: 10000000
    layers:
      l2:
        adjustable: true
    description: "Rescue repetitive overlaps with k-mers below this occurrence count."

  min_hist_count:
    value_type: int
    application:
      kind: cli_option
      flag: "--min-hist-cnt"
      order: 208
    min: 0
    max: 1000
    layers:
      l2:
        adjustable: true
    description: "Ignore k-mer spectrum counts below this value."

  max_overlap_diff_ec:
    value_type: float
    application:
      kind: cli_option
      flag: "--max-od-ec"
      order: 209
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Maximum overlap difference during error correction."

  max_overlap_diff_final:
    value_type: float
    application:
      kind: cli_option
      flag: "--max-od-final"
      order: 210
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Maximum overlap difference during final overlap filtering."

  exact_list:
    value_type: path
    application:
      kind: cli_option
      flag: "--ex-list"
      order: 211
    layers:
      l2:
        adjustable: true
    description: "Exact/exception list used by hifiasm internals."

  exact_iterations:
    value_type: int
    application:
      kind: cli_option
      flag: "--ex-iter"
      order: 212
    min: 0
    max: 100
    layers:
      l2:
        adjustable: true
    description: "Iteration count for exact/exception handling."

  skip_triobin:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--skip-triobin"
      order: 213
    layers:
      l2:
        adjustable: true
    description: "Skip trio binning behavior."

  fast_mode:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--fast"
      order: 214
    layers:
      l2:
        adjustable: true
    description: "Fast assembly mode."

  dp_error_rate:
    value_type: float
    application:
      kind: cli_option
      flag: "--dp-er"
      order: 215
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Dynamic-programming error-rate parameter."

  unskew:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--unskew"
      order: 216
    layers:
      l2:
        adjustable: true
    description: "Enable unskew behavior."

  kpt_rate:
    value_type: float
    application:
      kind: cli_option
      flag: "--kpt-rate"
      order: 217
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Keep-rate parameter."

  low_heterozygosity_mode:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--low-het"
      order: 218
    layers:
      l2:
        adjustable: true
    description: "Enable mode for very low heterozygosity genomes."

  integer_correct:
    value_type: int
    application:
      kind: cli_option
      flag: "--integer-correct"
      order: 219
    min: 0
    max: 10
    layers:
      l2:
        adjustable: true
    description: "Integer correction mode parameter."

  assembly_cleaning_rounds:
    value_type: int
    application:
      kind: cli_option
      flag: "-a"
      order: 220
    min: 0
    max: 50
    layers:
      l2:
        adjustable: true
    description: "Rounds of assembly graph cleaning."

  contig_bubble_pop_distance:
    value_type: int
    application:
      kind: cli_option
      flag: "-m"
      order: 221
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Pop bubbles below this size in contig graphs."

  unitig_bubble_pop_distance:
    value_type: int
    application:
      kind: cli_option
      flag: "-p"
      order: 222
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Pop bubbles below this size in unitig graphs."

  short_unitig_read_count:
    value_type: int
    application:
      kind: cli_option
      flag: "-n"
      order: 223
    min: 0
    max: 1000
    layers:
      l2:
        adjustable: true
    description: "Remove tip unitigs composed of <=INT reads."

  max_overlap_drop_ratio:
    value_type: float
    application:
      kind: cli_option
      flag: "-x"
      order: 224
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Max overlap drop ratio."

  min_overlap_drop_ratio:
    value_type: float
    application:
      kind: cli_option
      flag: "-y"
      order: 225
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Min overlap drop ratio."

  post_join:
    value_type: int
    application:
      kind: cli_option
      flag: "-u"
      order: 226
    allowed_values: [0, 1]
    layers:
      l2:
        adjustable: true
    description: "Post-join step switch."

  primary_coverage_range:
    value_type: string
    application:
      kind: cli_option
      flag: "--pri-range"
      order: 227
    layers:
      l2:
        adjustable: true
    description: "Min,max coverage cutoff for primary contigs."

  low_quality_bed_threshold:
    value_type: int
    application:
      kind: cli_option
      flag: "--lowQ"
      order: 228
    min: 0
    max: 100
    layers:
      l2:
        adjustable: true
    description: "Output contig regions with >=INT percent inconsistency; 0 disables."

  break_low_coverage:
    value_type: int
    application:
      kind: cli_option
      flag: "--b-cov"
      order: 229
    min: -1
    layers:
      l2:
        adjustable: true
    description: "Break contigs at low-coverage positions; works with --m-rate."

  break_high_coverage:
    value_type: int
    application:
      kind: cli_option
      flag: "--h-cov"
      order: 230
    min: -1
    layers:
      l2:
        adjustable: true
    description: "Break contigs at high-coverage positions; works with --m-rate."

  break_overlap_rate:
    value_type: float
    application:
      kind: cli_option
      flag: "--m-rate"
      order: 231
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Break contigs with <=FLOAT*coverage exact overlaps."

  contig_tip_read_count:
    value_type: int
    application:
      kind: cli_option
      flag: "--ctg-n"
      order: 232
    min: 0
    max: 1000
    layers:
      l2:
        adjustable: true
    description: "Remove tip contigs composed of <=INT reads."

  trio_lower_frequency:
    value_type: int
    application:
      kind: cli_option
      flag: "-c"
      order: 233
    min: 0
    max: 1000000
    layers:
      l2:
        adjustable: true
    description: "Lower bound of binned k-mer frequency."

  trio_upper_frequency:
    value_type: int
    application:
      kind: cli_option
      flag: "-d"
      order: 234
    min: 0
    max: 1000000
    layers:
      l2:
        adjustable: true
    description: "Upper bound of binned k-mer frequency."

  trio_unexpected_occurrence:
    value_type: int
    application:
      kind: cli_option
      flag: "--t-occ"
      order: 235
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Remove unitigs with unexpected haplotype-specific reads."

  trio_dual:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--trio-dual"
      order: 236
    layers:
      l2:
        adjustable: true
    description: "Use homology information to correct trio phasing errors."

  purge_level:
    value_type: int
    application:
      kind: cli_option
      flag: "-l"
      order: 237
    allowed_values: [0, 1, 2, 3]
    layers:
      l2:
        adjustable: true
    description: "Purge duplication level."

  purge_similarity:
    value_type: float
    application:
      kind: cli_option
      flag: "-s"
      order: 238
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Similarity threshold for duplicate haplotig purging."

  duplicate_overlap_min_reads:
    value_type: int
    application:
      kind: cli_option
      flag: "-O"
      order: 239
    min: 1
    layers:
      l2:
        adjustable: true
    description: "Minimum overlapped reads for duplicate haplotigs."

  purge_max:
    value_type: int
    application:
      kind: cli_option
      flag: "--purge-max"
      order: 240
    min: 1
    layers:
      l2:
        adjustable: true
    description: "Coverage upper bound of Purge-dups."

  homology_base_similarity:
    value_type: float
    application:
      kind: cli_option
      flag: "--s-base"
      order: 241
    min: -1
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Similarity threshold for homology detection in base-level."

  hic_weight_rounds:
    value_type: int
    application:
      kind: cli_option
      flag: "--n-weight"
      order: 242
    min: 0
    max: 1000
    layers:
      l2:
        adjustable: true
    description: "Rounds of reweighting Hi-C links."

  hic_perturb_rounds:
    value_type: int
    application:
      kind: cli_option
      flag: "--n-perturb"
      order: 243
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Rounds of Hi-C perturbation."

  hic_flip_fraction:
    value_type: float
    application:
      kind: cli_option
      flag: "--f-perturb"
      order: 244
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Fraction to flip for perturbation."

  hic_misjoin_length:
    value_type: int
    application:
      kind: cli_option
      flag: "--l-msjoin"
      order: 245
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Detect misjoined unitigs of >=INT bases; 0 disables."

  ul_error_rate:
    value_type: float
    application:
      kind: cli_option
      flag: "--ul-rate"
      order: 246
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Error rate of ultra-long reads."

  ul_tip_read_count:
    value_type: int
    application:
      kind: cli_option
      flag: "--ul-tip"
      order: 247
    min: 0
    max: 1000
    layers:
      l2:
        adjustable: true
    description: "Remove tip unitigs composed of <=INT reads for UL assembly."

  ul_rounds:
    value_type: int
    application:
      kind: cli_option
      flag: "--ul-round"
      order: 248
    min: 0
    max: 100
    layers:
      l2:
        adjustable: true
    description: "Ultra-long assembly round count."

  ul_cut:
    value_type: int
    application:
      kind: cli_option
      flag: "--ul-cut"
      order: 249
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Filter out ultra-long reads shorter than INT."

  ul_mode:
    value_type: int
    application:
      kind: cli_option
      flag: "--ul-m"
      order: 250
    allowed_values: [0, 1]
    layers:
      l2:
        adjustable: true
    description: "Hybrid ultra-long assembly mode."

  path_max_drop_ratio:
    value_type: float
    application:
      kind: cli_option
      flag: "--path-max"
      order: 251
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Maximum path drop ratio."

  path_min_drop_ratio:
    value_type: float
    application:
      kind: cli_option
      flag: "--path-min"
      order: 252
    min: 0
    max: 1
    layers:
      l2:
        adjustable: true
    description: "Minimum path drop ratio."

  dual_scaffold:
    value_type: boolean
    application:
      kind: cli_switch
      flag: "--dual-scaf"
      order: 253
    layers:
      l2:
        adjustable: true
    description: "Output self-scaffolding."

  scaffold_gap:
    value_type: int
    application:
      kind: cli_option
      flag: "--scaf-gap"
      order: 254
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Maximum gap size for scaffolding."

  somatic_coverage:
    value_type: int
    application:
      kind: cli_option
      flag: "--somatic-cov"
      order: 255
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Somatic coverage parameter."

  telomere_motif:
    value_type: string
    application:
      kind: cli_option
      flag: "--telo-m"
      order: 256
    layers:
      l2:
        adjustable: true
    description: "Telomere motif at 5-prime end."

  telomere_penalty:
    value_type: int
    application:
      kind: cli_option
      flag: "--telo-p"
      order: 257
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Non-telomeric penalty."

  telomere_drop:
    value_type: int
    application:
      kind: cli_option
      flag: "--telo-d"
      order: 258
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Telomere max drop."

  telomere_min_score:
    value_type: int
    application:
      kind: cli_option
      flag: "--telo-s"
      order: 259
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Minimum score for telomere reads."

  chimeric_support:
    value_type: int
    application:
      kind: cli_option
      flag: "--chem-c"
      order: 260
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Chimeric read detection support threshold."

  chimeric_flank:
    value_type: int
    application:
      kind: cli_option
      flag: "--chem-f"
      order: 261
    min: 0
    layers:
      l2:
        adjustable: true
    description: "Chimeric read detection flanking length."

  read_length_cutoff:
    value_type: int
