catalog_id: nextdenovo
method_id: nextdenovo
tool: nextDenovo
description: "NextDenovo long-read assembly catalog for Phase11 typed parameter attempts."

parameters:
  read_type:
    value_type: string
    application:
      kind: stage_value
      key: read_type
    allowed_values: ["ont", "clr", "hifi"]
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
    description: "NextDenovo read type used in run.cfg."

  input_fofn:
    value_type: path
    application:
      kind: stage_value
      key: input_fofn
    layers:
      l0:
        kind: runtime
        binding: assembly_input_reads
    description: "Input FOFN path used in run.cfg."

  work_dir:
    value_type: path
    application:
      kind: stage_value
      key: work_dir
    layers:
      l0:
        kind: runtime
        binding: assembly_output_dir
    description: "NextDenovo work directory."

  genome_size:
    value_type: int
    application:
      kind: stage_value
      key: genome_size
    min: 1
    layers:
      l1:
        fact: effective_genome_size_bp
        transform: identity
    description: "Estimated genome size in bases."

  threads:
    value_type: int
    application:
      kind: stage_value
      key: threads
    min: 1
    layers:
      l0:
        kind: runtime
        binding: assembly_threads
        required: false
        materialized_default: 32
    description: "Number of CPU threads."

  read_n50:
    value_type: int
    application:
      kind: stage_value
      key: read_n50
    min: 1
    layers:
      l1:
        fact: read_n50_bp
        transform: identity
    description: "Readonly read N50 context."

  estimated_coverage:
    value_type: float
    application:
      kind: stage_value
      key: estimated_coverage
    min: 0
    layers:
      l1:
        fact: raw_coverage_x
        transform: identity
    description: "Readonly sequencing coverage context; omitted until a producer publishes this field."

  read_cutoff:
    value_type: int
    application:
      kind: stage_value
      key: read_cutoff
    min: 1
    max: 100000
    layers:
      l2:
        adjustable: true
    description: "Minimum read length cutoff written to run.cfg."

  nextgraph_a:
    value_type: int
    application:
      kind: stage_value
      key: nextgraph_a
    min: 1
    max: 10
    layers:
      l2:
        adjustable: true
    description: "NextGraph -a assembly graph option written to run.cfg."
