catalog_id: nextdenovo
method_id: assembly.candidate.nextdenovo
tool: nextDenovo
description: "NextDenovo long-read assembly catalog for Phase11 typed parameter attempts."

parameters:
  read_type:
    value_type: string
    application:
      kind: config_key
      key: read_type
    required_for_execution: true
    allowed_values: ["ont", "clr", "hifi"]
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
    description: "NextDenovo read type used in run.cfg."

  input_fofn:
    value_type: path
    application:
      kind: config_key
      key: input_fofn
    required_for_execution: true
    layers:
      l0:
        kind: runtime
        binding: assembly_input_reads
    description: "Input FOFN path used in run.cfg."

  work_dir:
    value_type: path
    application:
      kind: config_key
      key: workdir
    required_for_execution: true
    layers:
      l0:
        kind: runtime
        binding: assembly_output_dir
    description: "NextDenovo work directory."

  genome_size:
    value_type: int
    application:
      kind: config_key
      key: genome_size
    required_for_execution: true
    min: 1
    layers:
      l1:
        fact: effective_genome_size_bp
        transform: identity
    description: "Estimated genome size in bases."

  threads:
    value_type: int
    application:
      kind: config_key
      key: threads
    min: 1
    layers:
      l0:
        kind: runtime
        binding: assembly_threads
        required: false
        materialized_default: 32
    description: "Number of CPU threads."

  read_cutoff:
    value_type: int
    application:
      kind: config_key
      key: read_cutoff
    min: 1
    max: 100000
    layers:
      l2:
        adjustable: true
    description: "Minimum read length cutoff written to run.cfg."

  nextgraph_a:
    value_type: int
    application:
      kind: config_key
      key: nextgraph_a
    min: 1
    max: 10
    layers:
      l2:
        adjustable: true
    description: "NextGraph -a assembly graph option written to run.cfg."
