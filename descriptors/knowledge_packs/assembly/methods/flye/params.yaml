catalog_id: assembly.flye
method_id: assembly.flye
tool: flye
description: "Flye long-read assembly catalog for Phase11 typed parameter attempts."

parameters:
  read_type:
    value_type: string
    application:
      kind: stage_value
      key: read_type
    allowed_values: ["nano-raw", "nano-hq", "pacbio-raw", "pacbio-hifi"]
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
    description: "Flye read mode; emitted as the corresponding read-type flag."

  input_reads:
    value_type: path_list
    application:
      kind: positional
      position: 0
    layers:
      l0:
        kind: runtime
        binding: assembly_input_reads
    description: "Input read files."

  output_dir:
    value_type: path
    application:
      kind: cli_option
      flag: "--out-dir"
      order: 0
    layers:
      l0:
        kind: runtime
        binding: assembly_output_dir
    description: "Flye output directory."

  genome_size:
    value_type: int
    application:
      kind: cli_option
      flag: "--genome-size"
      order: 1
    min: 1
    layers:
      l1:
        fact: effective_genome_size_bp
        transform: identity
    description: "Estimated genome size in bases."

  threads:
    value_type: int
    application:
      kind: cli_option
      flag: "--threads"
      order: 2
    min: 1
    layers:
      l0:
        kind: runtime
        binding: assembly_threads
        required: false
        materialized_default: 32
    description: "Number of CPU threads."

  read_n50:
    value_type: int
    application:
      kind: stage_value
      key: read_n50
    min: 1
    layers:
      l1:
        fact: read_n50_bp
        transform: identity
    description: "Readonly read N50 context."

  estimated_coverage:
    value_type: float
    application:
      kind: stage_value
      key: estimated_coverage
    min: 0
    layers:
      l1:
        fact: raw_coverage_x
        transform: identity
    description: "Readonly sequencing coverage context; omitted until a producer publishes this field."

  asm_coverage:
    value_type: int
    application:
      kind: cli_option
      flag: "--asm-coverage"
      order: 200
    min: 1
    max: 200
    layers:
      l2:
        adjustable: true
    description: "Optional subset coverage for very high-coverage datasets."

  min_overlap:
    value_type: int
    application:
      kind: cli_option
      flag: "--min-overlap"
      order: 201
    min: 100
    max: 50000
    layers:
      l2:
        adjustable: true
    description: "Minimum overlap between reads."
