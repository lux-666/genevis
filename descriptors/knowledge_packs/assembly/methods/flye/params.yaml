method_id: flye
tool: flye
read_type: ont
description: "Flye long-read assembly catalog for Phase11 typed parameter attempts."

parameters:
  read_type:
    cli: null
    level: 0
    source: run_config
    value_type: string
    allowed_values: ["nano-raw", "nano-hq", "pacbio-raw", "pacbio-hifi"]
    source_priority:
      - assembly.flye_parameters.read_type
      - assembly.read_type_prior.flye
      - shared_parameters.read_type
    description: "Flye read mode; emitted as the corresponding read-type flag."
  input_reads:
    cli: null
    level: 0
    source: executor
    value_type: path_list
    source_priority:
      - execution.input_reads
    description: "Input read files."
  output_dir:
    cli: "--out-dir"
    level: 0
    source: executor
    value_type: path
    source_priority:
      - execution.output_dir
    description: "Flye output directory."
  genome_size:
    cli: "--genome-size"
    level: 0
    source: run_config
    value_type: int
    min: 1
    source_priority:
      - assembly.flye_parameters.estimated_genome_size
      - assembly.genome_size_prior
      - genome_survey.genome_size_prior
      - genome_survey.estimates.genome_size_prior
      - genome_survey.estimates.genome_size
      - shared_parameters.estimated_genome_size
    description: "Estimated genome size in bases."
  threads:
    cli: "--threads"
    level: 0
    source: run_config
    value_type: int
    default: 32
    min: 1
    source_priority:
      - assembly.flye_parameters.threads
    description: "Number of CPU threads."

  read_n50:
    cli: null
    level: 1
    source: read_qc
    value_type: int
    min: 1
    source_priority:
      - read_qc.read_n50
      - read_qc.stats.read_n50
    description: "Readonly read N50 context."
  estimated_coverage:
    cli: null
    level: 1
    source: read_qc
    value_type: float
    min: 0
    source_priority:
      - read_qc.estimated_coverage
      - read_qc.effective_coverage_1kb
    description: "Readonly sequencing coverage context."

  asm_coverage:
    cli: "--asm-coverage"
    level: 2
    source: parameter_recommender
    value_type: int
    min: 1
    max: 200
    description: "Optional subset coverage for very high-coverage datasets."
  min_overlap:
    cli: "--min-overlap"
    level: 2
    source: parameter_recommender
    value_type: int
    min: 100
    max: 50000
    description: "Minimum overlap between reads."
