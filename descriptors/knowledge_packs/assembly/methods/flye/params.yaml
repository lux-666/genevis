catalog_id: flye
method_id: assembly.candidate.flye
tool: flye
description: "Flye long-read assembly catalog for Phase11 typed parameter attempts."

parameters:
  read_type:
    value_type: string
    application:
      kind: selector
    required_for_execution: true
    allowed_values: ["nano-raw", "nano-hq", "pacbio-raw", "pacbio-hifi"]
    layers:
      l0:
        kind: runtime
        binding: assembly_method_read_type
    description: "Flye read mode; emitted as the corresponding read-type flag."

  input_reads:
    value_type: path_list
    application:
      kind: choice_option
      selector: read_type
      flags:
        nano-raw: "--nano-raw"
        nano-hq: "--nano-hq"
        pacbio-raw: "--pacbio-raw"
        pacbio-hifi: "--pacbio-hifi"
      order: 10
      join: expand
    required_for_execution: true
    layers:
      l0:
        kind: runtime
        binding: assembly_input_reads
    description: "Input read files emitted immediately after the selected read-type flag."

  output_dir:
    value_type: path
    application:
      kind: cli_option
      flag: "--out-dir"
      order: 20
    required_for_execution: true
    layers:
      l0:
        kind: runtime
        binding: assembly_output_dir
    description: "Flye output directory."

  genome_size:
    value_type: int
    application:
      kind: cli_option
      flag: "--genome-size"
      order: 30
    required_for_execution: true
    min: 1
    layers:
      l1:
        fact: effective_genome_size_bp
        transform: identity
    description: "Estimated genome size in bases."

  threads:
    value_type: int
    application:
      kind: cli_option
      flag: "--threads"
      order: 40
    min: 1
    layers:
      l0:
        kind: runtime
        binding: assembly_threads
        required: false
        materialized_default: 32
    description: "Number of CPU threads."

  asm_coverage:
    value_type: int
    application:
      kind: cli_option
      flag: "--asm-coverage"
      order: 200
    min: 1
    max: 200
    layers:
      l2:
        adjustable: true
    description: "Optional subset coverage for very high-coverage datasets."

  min_overlap:
    value_type: int
    application:
      kind: cli_option
      flag: "--min-overlap"
      order: 201
    min: 100
    max: 50000
    layers:
      l2:
        adjustable: true
    description: "Minimum overlap between reads."
