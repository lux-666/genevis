pack_id: assembly.t2t_criteria
version: "1.0"

allowed_verdicts:
  - adopt_draft
  - near_t2t
  - strict_t2t_candidate
  - insufficient
  - request_data

allowed_human_decisions:
  - adopt_draft
  - adopt_near_t2t
  - adopt_strict_t2t
  - request_more_data
  - stop_human_review

hic_gates:
  max_misassembly_for_near_t2t: 10
  quality_tiers:
    high:
      min_alignment_rate: 0.85
      max_misassembly: 5
    medium:
      min_alignment_rate: 0.70
      max_misassembly: 20
    low:
      min_alignment_rate: 0.0
      max_misassembly: 999

safety_boundaries:
  never_auto_adopt_strict_t2t: true
