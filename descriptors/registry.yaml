packages:
  busco: busco.yaml
  3ddna: 3ddna.yaml
  autohic: autohic.yaml
  flye: flye.yaml
  genomescope2: genomescope2.yaml
  hifiasm: hifiasm.yaml
  jellyfish: jellyfish.yaml
  minimap2: minimap2.yaml
  nextdenovo: nextdenovo.yaml
  purge_dups: purge_dups.yaml
  python: python.yaml
  quast: quast.yaml
  juicer: juicer.yaml
  juicebox: juicebox.yaml
  seqkit: seqkit.yaml
  tgsgapcloser: tgsgapcloser.yaml
  racon: racon.yaml
methods:
  assembly.candidate.flye: assembly/flye_candidate.yaml
  assembly.candidate.hifiasm: assembly/hifiasm_candidate.yaml
  assembly.candidate.hifiasm_ont: assembly/hifiasm_ont_candidate.yaml
  assembly.candidate.nextdenovo: assembly/nextdenovo_candidate.yaml
  assembly_dedup.purge_dups: assembly_dedup/purge_dups.yaml
  assembly_dedup.eval.quast: assembly_dedup/quast_eval.yaml
  assembly_review.eval.quast: assembly_review/quast_eval.yaml
  assembly_review.eval.busco: assembly_review/busco_eval.yaml
  genome_survey.kmer_count.jellyfish: genome_survey/jellyfish_kmer_count.yaml
  genome_survey.model.genomescope2: genome_survey/genomescope2_model.yaml
  hic_scaffolding.candidate.autohic: hic_scaffolding/autohic_candidate.yaml
  t2t.alignment.minimap2: t2t/minimap2_telomere_alignment.yaml
  gapcloser.tgs_gapcloser: gapcloser/tgs_gapcloser.yaml
  base_polish.racon: base_polish/racon.yaml
  read_qc.length_filter.seqkit_seq: read_qc/seqkit_seq_length_filter.yaml
  read_qc.length_filter.skip: read_qc/length_filter_skip.yaml
  read_qc.long_read_stats.seqkit_stats: read_qc/seqkit_stats.yaml
by_stage:
  inventory: []
  read_qc:
    - read_qc.long_read_stats.seqkit_stats
    - read_qc.length_filter.skip
    - read_qc.length_filter.seqkit_seq
  genome_survey:
    - genome_survey.kmer_count.jellyfish
    - genome_survey.model.genomescope2
  assembly:
    - assembly.candidate.flye
    - assembly.candidate.hifiasm
    - assembly.candidate.hifiasm_ont
    - assembly.candidate.nextdenovo
  assembly_dedup:
    - assembly_dedup.purge_dups
    - assembly_dedup.eval.quast
  assembly_review:
    - assembly_review.eval.quast
    - assembly_review.eval.busco
  hic_scaffolding:
    - hic_scaffolding.candidate.autohic
  t2t:
    - t2t.alignment.minimap2
  gapcloser:
    - gapcloser.tgs_gapcloser
  base_polish:
    - base_polish.racon
