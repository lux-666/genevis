    - assembly.candidate.hifiasm
    - assembly.candidate.nextdenovo
    - assembly.candidate.canu
  assembly_review:
    - assembly_review.eval.quast
    - assembly_review.eval.busco
    - assembly_review.eval.merqury
    - assembly_review.eval.mapping_coverage
    - assembly_review.check.purge_dups
    - assembly_review.check.contamination
  hic_scaffolding:
    - hic_scaffolding.candidate.yahs
    - hic_scaffolding.candidate.juicer_3ddna_juicebox
